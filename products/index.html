<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Products - Seyler Enterprises Inc.</title>

  <link rel="stylesheet" href="styles.css" />

  <meta name="description" content="Seyler Enterprises Inc. provides high‑quality natural stone veneer for residential and commercial projects.">
  <meta name="keywords" content="stone veneer, stone, stonework, stone veneer consultation, building stone, natural stone">
  <meta property="og:title" content="Seyler Enterprises Inc. - Stone Veneer Experts">
  <meta property="og:description" content="Discover high‑quality stone veneer products from Seyler Enterprises Inc.">
  <link rel="icon" href="images/seylerlogo.png" type="image/png">
</head>

<body>
  <header id="home">
    <nav class="site-nav" id="top">
      <a href="https://seylerenterprisesinc.us" class="brand">
        <img src="images/seylerlogo.png" alt="Seyler Enterprises mountain logo" class="logo">
        <span class="brand-text">Seyler Enterprises Inc.</span>
      </a>

      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links">
        <li><a href="https://seylerenterprisesinc.us">Home</a></li>
        <li><a href="https://seylerenterprisesinc.us/#about">About Us</a></li>
        <li><a href="#top">Products</a></li>
        <li><a href="https://seylerenterprisesinc.us/#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="section products-page">
    <div class="section-inner">
      <header class="products-header">
        <h1>Stone Veneer Products</h1>
        <p>Filter by style and click any stone to see more photos and details.</p>
      </header>

      <div class="product-filters" role="group" aria-label="Filter products">
        <button class="filter-pill is-active" data-filter="all" type="button">All</button>
        <button class="filter-pill" data-filter="mini-ledgestone" type="button">Mini Ledgestone</button>
        <button class="filter-pill" data-filter="ledgestone" type="button">Ledgestone</button>
        <button class="filter-pill" data-filter="square-rectangle" type="button">Square + Rectangle</button>
        <button class="filter-pill" data-filter="mosaic" type="button">Mosaic</button>
        <button class="filter-pill" data-filter="building-stone" type="button">Building Stone</button>
      </div>

      <div class="products-grid" id="productsGrid" aria-label="Product grid"></div>
    </div>
  </section>

  <div class="modal" id="productModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close="true"></div>

    <div class="modal-panel" role="document" aria-label="Product details">
      <button class="modal-close" type="button" aria-label="Close" data-close="true">×</button>

      <div class="modal-body">
        <div class="modal-media">
          <img id="modalMainImage" class="modal-main-image" src="" alt="" />
          <div class="modal-thumbs" id="modalThumbs" aria-label="More photos"></div>
        </div>

        <div class="modal-info">
          <h2 id="modalTitle" class="modal-title"></h2>
          <p id="modalDescription" class="modal-description"></p>
          <dl id="modalSpecs" class="modal-specs"></dl>
        </div>
      </div>
    </div>
  </div>

  <script src="product.js"></script>
</body>
</html>
